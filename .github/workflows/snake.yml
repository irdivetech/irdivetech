name: Custom Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Custom Snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: irdivetech
        run: |
          node <<'NODE'
          const fs = require("fs");
          const https = require("https");

          const TOKEN = process.env.GITHUB_TOKEN;
          const USERNAME = process.env.GITHUB_USERNAME;

          if (!TOKEN) {
            throw new Error("GITHUB_TOKEN tidak tersedia.");
          }

          const query = `
            query($login: String!) {
              user(login: $login) {
                contributionsCollection {
                  contributionCalendar {
                    totalContributions
                    weeks {
                      contributionDays {
                        contributionCount
                        date
                        weekday
                      }
                    }
                  }
                }
              }
            }
          `;

          function graphqlRequest() {
            return new Promise((resolve, reject) => {
              const body = JSON.stringify({
                query,
                variables: {
                  login: USERNAME
                }
              });

              const req = https.request(
                {
                  hostname: "api.github.com",
                  path: "/graphql",
                  method: "POST",
                  headers: {
                    "Authorization": `Bearer ${TOKEN}`,
                    "Content-Type": "application/json",
                    "User-Agent": "custom-github-snake",
                    "Content-Length": Buffer.byteLength(body)
                  }
                },
                (res) => {
                  let response = "";

                  res.on("data", chunk => {
                    response += chunk;
                  });

                  res.on("end", () => {
                    try {
                      const parsed = JSON.parse(response);

                      if (parsed.errors) {
                        reject(
                          new Error(
                            JSON.stringify(parsed.errors)
                          )
                        );
                        return;
                      }

                      resolve(parsed.data);
                    } catch (error) {
                      reject(error);
                    }
                  });
                }
              );

              req.on("error", reject);
              req.write(body);
              req.end();
            });
          }

          function esc(value) {
            return String(value)
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;")
              .replace(/'/g, "&apos;");
          }

          function contributionColor(count, dark) {
            if (dark) {
              if (count === 0) return "#161b22";
              if (count <= 2) return "#0e4429";
              if (count <= 5) return "#006d32";
              if (count <= 9) return "#26a641";
              return "#39d353";
            }

            if (count === 0) return "#ebedf0";
            if (count <= 2) return "#9be9a8";
            if (count <= 5) return "#40c463";
            if (count <= 9) return "#30a14e";
            return "#216e39";
          }

          function buildSvg(calendar, darkMode) {
            const weeks = calendar.weeks;

            const cell = 11;
            const gap = 3;

            const left = 18;
            const top = 18;
            const right = 18;
            const bottom = 34;

            const columns = weeks.length;
            const rows = 7;

            const width =
              left +
              columns * (cell + gap) -
              gap +
              right;

            const height =
              top +
              rows * (cell + gap) -
              gap +
              bottom;

            const cells = [];

            for (let col = 0; col < columns; col++) {
              for (let row = 0; row < rows; row++) {
                const day =
                  weeks[col].contributionDays.find(
                    item => item.weekday === row
                  );

                cells.push({
                  col,
                  row,
                  count: day?.contributionCount || 0,
                  date: day?.date || ""
                });
              }
            }

            /*
             * Snake path:
             *
             * column 0 -> top to bottom
             * column 1 -> bottom to top
             * column 2 -> top to bottom
             *
             * Every next cell is adjacent.
             */
            const path = [];

            for (let col = 0; col < columns; col++) {
              const order =
                col % 2 === 0
                  ? [0, 1, 2, 3, 4, 5, 6]
                  : [6, 5, 4, 3, 2, 1, 0];

              for (const row of order) {
                path.push({ col, row });
              }
            }

            const food = new Map();

            for (const item of cells) {
              food.set(
                `${item.col}:${item.row}`,
                item.count
              );
            }

            const INITIAL_LENGTH = 4;
            const MAX_LENGTH = 90;

            let snakeLength = INITIAL_LENGTH;

            /*
             * Each contribution cell acts as food.
             *
             * 1 contribution = +1 segment
             * 2-3 contributions = +2 segments
             * 4-5 contributions = +3 segments
             * 6+ contributions = +4 segments
             *
             * This makes growth visibly easier to notice.
             */
            const growthFor = count => {
              if (count <= 0) return 0;
              if (count === 1) return 1;
              if (count <= 3) return 2;
              if (count <= 5) return 3;
              return 4;
            };

            const frames = [];

            for (let i = 0; i < path.length; i++) {
              const head = path[i];

              const count =
                food.get(
                  `${head.col}:${head.row}`
                ) || 0;

              if (count > 0) {
                snakeLength = Math.min(
                  MAX_LENGTH,
                  snakeLength + growthFor(count)
                );
              }

              const start =
                Math.max(
                  0,
                  i - snakeLength + 1
                );

              /*
               * Head first.
               */
              const body =
                path
                  .slice(start, i + 1)
                  .reverse();

              frames.push({
                body,
                length: body.length
              });
            }

            /*
             * At least one complete animation cycle:
             * 36 seconds.
             */
            const duration = "36s";

            const bg =
              darkMode
                ? "#0d1117"
                : "#ffffff";

            const border =
              darkMode
                ? "#30363d"
                : "#d0d7de";

            const snakeColor =
              darkMode
                ? "#58a6ff"
                : "#0969da";

            const headColor =
              darkMode
                ? "#79c0ff"
                : "#0550ae";

            const parts = [];

            /*
             * Background
             */
            parts.push(`
              <rect
                width="100%"
                height="100%"
                rx="12"
                fill="${bg}"
                stroke="${border}"
              />
            `);

            /*
             * Contribution graph
             */
            parts.push(`
              <g>
                ${cells.map(item => {
                  const x =
                    left +
                    item.col * (cell + gap);

                  const y =
                    top +
                    item.row * (cell + gap);

                  return `
                    <rect
                      x="${x}"
                      y="${y}"
                      width="${cell}"
                      height="${cell}"
                      rx="2.5"
                      fill="${contributionColor(
                        item.count,
                        darkMode
                      )}"
                    >
                      <title>
                        ${esc(
                          `${item.date}: ${item.count} contribution${item.count === 1 ? "" : "s"}`
                        )}
                      </title>
                    </rect>
                  `;
                }).join("")}
              </g>
            `);

            /*
             * Food pulse.
             */
            parts.push(`
              <g>
                ${cells
                  .filter(item => item.count > 0)
                  .map(item => {
                    const x =
                      left +
                      item.col * (cell + gap) +
                      cell / 2;

                    const y =
                      top +
                      item.row * (cell + gap) +
                      cell / 2;

                    return `
                      <circle
                        cx="${x}"
                        cy="${y}"
                        r="2"
                        fill="${darkMode ? "#7ee787" : "#1a7f37"}"
                        opacity="0.45"
                      >
                        <animate
                          attributeName="r"
                          values="1.5;3;1.5"
                          dur="1.5s"
                          repeatCount="indefinite"
                        />
                        <animate
                          attributeName="opacity"
                          values="0.3;0.8;0.3"
                          dur="1.5s"
                          repeatCount="indefinite"
                        />
                      </circle>
                    `;
                  })
                  .join("")}
              </g>
            `);

            /*
             * IMPORTANT:
             *
             * Every snake segment is a separate circle.
             *
             * This makes actual growth visible:
             *
             *  segment 1
             *  segment 2
             *  segment 3
             *       ↓
             *  eat
             *       ↓
             *  segment 4
             *  segment 5
             */
            const maxSegments = MAX_LENGTH;

            for (
              let segmentIndex = maxSegments - 1;
              segmentIndex >= 0;
              segmentIndex--
            ) {
              const cxValues = [];
              const cyValues = [];
              const opacityValues = [];

              for (const frame of frames) {
                const point =
                  frame.body[segmentIndex];

                if (!point) {
                  cxValues.push(-50);
                  cyValues.push(-50);
                  opacityValues.push(0);
                  continue;
                }

                const x =
                  left +
                  point.col * (cell + gap) +
                  cell / 2;

                const y =
                  top +
                  point.row * (cell + gap) +
                  cell / 2;

                cxValues.push(x);
                cyValues.push(y);
                opacityValues.push(1);
              }

              /*
               * Tail/body segments.
               */
              parts.push(`
                <circle
                  cx="${cxValues[0]}"
                  cy="${cyValues[0]}"
                  r="${cell * 0.34}"
                  fill="${snakeColor}"
                  opacity="${opacityValues[0]}"
                >
                  <animate
                    attributeName="cx"
                    dur="${duration}"
                    repeatCount="indefinite"
                    calcMode="discrete"
                    values="${cxValues.join(";")}"
                  />

                  <animate
                    attributeName="cy"
                    dur="${duration}"
                    repeatCount="indefinite"
                    calcMode="discrete"
                    values="${cyValues.join(";")}"
                  />

                  <animate
                    attributeName="opacity"
                    dur="${duration}"
                    repeatCount="indefinite"
                    calcMode="discrete"
                    values="${opacityValues.join(";")}"
                  />
                </circle>
              `);
            }

            /*
             * Animated head.
             */
            const headX = [];
            const headY = [];

            for (const frame of frames) {
              const point = frame.body[0];

              const x =
                left +
                point.col * (cell + gap) +
                cell / 2;

              const y =
                top +
                point.row * (cell + gap) +
                cell / 2;

              headX.push(x);
              headY.push(y);
            }

            parts.push(`
              <circle
                cx="${headX[0]}"
                cy="${headY[0]}"
                r="${cell * 0.46}"
                fill="${headColor}"
              >
                <animate
                  attributeName="cx"
                  dur="${duration}"
                  repeatCount="indefinite"
                  calcMode="discrete"
                  values="${headX.join(";")}"
                />

                <animate
                  attributeName="cy"
                  dur="${duration}"
                  repeatCount="indefinite"
                  calcMode="discrete"
                  values="${headY.join(";")}"
                />
              </circle>
            `);

            /*
             * Eye.
             */
            const eyeX = headX.map(x => x - 1.7);
            const eyeY = headY.map(y => y - 1.7);

            parts.push(`
              <circle
                cx="${eyeX[0]}"
                cy="${eyeY[0]}"
                r="1.4"
                fill="#ffffff"
              >
                <animate
                  attributeName="cx"
                  dur="${duration}"
                  repeatCount="indefinite"
                  calcMode="discrete"
                  values="${eyeX.join(";")}"
                />

                <animate
                  attributeName="cy"
                  dur="${duration}"
                  repeatCount="indefinite"
                  calcMode="discrete"
                  values="${eyeY.join(";")}"
                />
              </circle>
            `);

            /*
             * Footer.
             */
            parts.push(`
              <text
                x="${width / 2}"
                y="${height - 11}"
                text-anchor="middle"
                font-family="Arial, Helvetica, sans-serif"
                font-size="10"
                fill="${darkMode ? "#8b949e" : "#57606a"}"
              >
                🐍 ${calendar.totalContributions.toLocaleString()} contributions
              </text>
            `);

            return `<?xml version="1.0" encoding="UTF-8"?>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="${width}"
            height="${height}"
            viewBox="0 0 ${width} ${height}"
          >
            ${parts.join("\n")}
          </svg>`;
          }

          async function main() {
            console.log(
              `Fetching contributions for ${USERNAME}...`
            );

            const data =
              await graphqlRequest();

            const calendar =
              data?.user
                ?.contributionsCollection
                ?.contributionCalendar;

            if (!calendar) {
              throw new Error(
                "Contribution calendar tidak ditemukan."
              );
            }

            console.log(
              `Total contributions: ${calendar.totalContributions}`
            );

            console.log(
              `Weeks: ${calendar.weeks.length}`
            );

            fs.mkdirSync(
              "/tmp/snake",
              { recursive: true }
            );

            fs.writeFileSync(
              "/tmp/snake/github-contribution-grid-snake.svg",
              buildSvg(calendar, false)
            );

            fs.writeFileSync(
              "/tmp/snake/github-contribution-grid-snake-dark.svg",
              buildSvg(calendar, true)
            );

            console.log(
              "Custom growing snake berhasil dibuat."
            );
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Publish Snake
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf dist
          mkdir -p dist

          cp /tmp/snake/github-contribution-grid-snake.svg dist/
          cp /tmp/snake/github-contribution-grid-snake-dark.svg dist/

          touch dist/.nojekyll

          git init
          git checkout --orphan output

          git add dist

          git commit -m "Update growing contribution snake"

          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/irdivetech/irdivetech.git"

          git subtree push --prefix dist origin output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
