name: Custom Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate growing snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: irdivetech
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('fs');
          const https = require('https');

          const TOKEN = process.env.GITHUB_TOKEN;
          const USERNAME = process.env.GITHUB_USERNAME;

          if (!TOKEN) {
            throw new Error('GITHUB_TOKEN tidak tersedia.');
          }

          const query = `
            query($login: String!) {
              user(login: $login) {
                contributionsCollection {
                  contributionCalendar {
                    totalContributions
                    weeks {
                      contributionDays {
                        date
                        contributionCount
                        weekday
                      }
                    }
                  }
                }
              }
            }
          `;

          function requestGraphQL() {
            return new Promise((resolve, reject) => {
              const body = JSON.stringify({
                query,
                variables: { login: USERNAME }
              });

              const req = https.request(
                {
                  hostname: 'api.github.com',
                  path: '/graphql',
                  method: 'POST',
                  headers: {
                    Authorization: `Bearer ${TOKEN}`,
                    'Content-Type': 'application/json',
                    'User-Agent': 'irdivetech-growing-snake',
                    'Content-Length': Buffer.byteLength(body)
                  }
                },
                (res) => {
                  let response = '';

                  res.on('data', chunk => {
                    response += chunk;
                  });

                  res.on('end', () => {
                    try {
                      const parsed = JSON.parse(response);

                      if (
                        res.statusCode < 200 ||
                        res.statusCode >= 300
                      ) {
                        reject(
                          new Error(
                            `GitHub API HTTP ${res.statusCode}: ${response}`
                          )
                        );
                        return;
                      }

                      if (parsed.errors) {
                        reject(
                          new Error(
                            `GitHub GraphQL error: ${JSON.stringify(parsed.errors)}`
                          )
                        );
                        return;
                      }

                      resolve(parsed.data);
                    } catch (error) {
                      reject(error);
                    }
                  });
                }
              );

              req.on('error', reject);
              req.write(body);
              req.end();
            });
          }

          function xmlEscape(value) {
            return String(value)
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
              .replace(/"/g, '&quot;')
              .replace(/'/g, '&apos;');
          }

          function colorFor(count, dark) {
            if (dark) {
              if (count === 0) return '#161b22';
              if (count <= 2) return '#0e4429';
              if (count <= 5) return '#006d32';
              if (count <= 9) return '#26a641';
              return '#39d353';
            }

            if (count === 0) return '#ebedf0';
            if (count <= 2) return '#9be9a8';
            if (count <= 5) return '#40c463';
            if (count <= 9) return '#30a14e';
            return '#216e39';
          }

          /*
           * Growth rules:
           *
           * 1-2 contributions = +1 segment
           * 3-5 contributions = +2 segments
           * 6-9 contributions = +3 segments
           * 10+ contributions = +4 segments
           */
          function growthFor(count) {
            if (count <= 0) return 0;
            if (count <= 2) return 1;
            if (count <= 5) return 2;
            if (count <= 9) return 3;
            return 4;
          }

          function buildSvg(calendar, darkMode) {
            const weeks = calendar.weeks;
            const columns = weeks.length;
            const rows = 7;

            const cell = 11;
            const gap = 3;

            const left = 18;
            const top = 18;
            const right = 18;
            const bottom = 36;

            const width =
              left +
              columns * (cell + gap) -
              gap +
              right;

            const height =
              top +
              rows * (cell + gap) -
              gap +
              bottom;

            const cells = [];
            const cellsByKey = new Map();

            for (let col = 0; col < columns; col++) {
              for (let row = 0; row < rows; row++) {
                const day = weeks[col].contributionDays.find(
                  item => item.weekday === row
                );

                const item = {
                  col,
                  row,
                  date: day?.date || '',
                  count: day?.contributionCount || 0
                };

                cells.push(item);
                cellsByKey.set(
                  `${col}:${row}`,
                  item
                );
              }
            }

            /*
             * Build a continuous serpentine route.
             *
             * Column 0:
             * 0 -> 1 -> 2 -> 3 -> 4 -> 5 -> 6
             *
             * Column 1:
             * 6 -> 5 -> 4 -> 3 -> 2 -> 1 -> 0
             *
             * This ensures the snake never jumps diagonally.
             */
            const route = [];

            for (let col = 0; col < columns; col++) {
              const rowOrder =
                col % 2 === 0
                  ? [0, 1, 2, 3, 4, 5, 6]
                  : [6, 5, 4, 3, 2, 1, 0];

              for (const row of rowOrder) {
                const item =
                  cellsByKey.get(`${col}:${row}`);

                route.push({
                  col,
                  row,
                  count: item?.count || 0,
                  date: item?.date || '',
                  x:
                    left +
                    col * (cell + gap) +
                    cell / 2,
                  y:
                    top +
                    row * (cell + gap) +
                    cell / 2
                });
              }
            }

            const totalSegments =
              Math.max(1, route.length - 1);

            /*
             * Snake starts small.
             * MAX_LENGTH prevents the snake from covering
             * the entire graph too early.
             */
            const INITIAL_LENGTH = 3;
            const MAX_LENGTH = Math.min(
              75,
              totalSegments
            );

            let snakeLength = INITIAL_LENGTH;

            const forwardFrames = [];

            for (let i = 0; i < route.length; i++) {
              const current = route[i];

              /*
               * Eat contribution cell.
               */
              if (current.count > 0) {
                snakeLength = Math.min(
                  MAX_LENGTH,
                  snakeLength +
                    growthFor(current.count)
                );
              }

              const startIndex =
                Math.max(
                  0,
                  i - snakeLength + 1
                );

              const visibleLength =
                Math.max(
                  1,
                  i - startIndex
                );

              forwardFrames.push({
                headX: current.x,
                headY: current.y,
                startRatio:
                  startIndex /
                  totalSegments,
                lengthRatio:
                  visibleLength /
                  totalSegments
              });
            }

            /*
             * Reverse the animation so it loops
             * without a hard jump.
             */
            const frames = [
              ...forwardFrames,
              ...forwardFrames.slice(
                0,
                -1
              ).reverse()
            ];

            const headXValues =
              frames
                .map(
                  frame => frame.headX
                )
                .join(';');

            const headYValues =
              frames
                .map(
                  frame => frame.headY
                )
                .join(';');

            const dashArrayValues =
              frames
                .map(
                  frame =>
                    `${Math.max(
                      1 / totalSegments,
                      frame.lengthRatio
                    )} 1`
                )
                .join(';');

            const dashOffsetValues =
              frames
                .map(
                  frame =>
                    `-${frame.startRatio}`
                )
                .join(';');

            const eyeXValues =
              frames
                .map(
                  frame =>
                    frame.headX - 1.8
                )
                .join(';');

            const eyeYValues =
              frames
                .map(
                  frame =>
                    frame.headY - 1.8
                )
                .join(';');

            const routePoints =
              route
                .map(
                  point =>
                    `${point.x},${point.y}`
                )
                .join(' ');

            const duration = '42s';

            const background = darkMode
              ? '#0d1117'
              : '#ffffff';

            const border = darkMode
              ? '#30363d'
              : '#d0d7de';

            const snakeColor = darkMode
              ? '#58a6ff'
              : '#0969da';

            const headColor = darkMode
              ? '#79c0ff'
              : '#0550ae';

            const textColor = darkMode
              ? '#8b949e'
              : '#57606a';

            const foodColor = darkMode
              ? '#7ee787'
              : '#1a7f37';

            return `<?xml version="1.0" encoding="UTF-8"?>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="${width}"
            height="${height}"
            viewBox="0 0 ${width} ${height}"
            role="img"
            aria-label="Growing GitHub contribution snake"
          >

            <!-- Background -->
            <rect
              width="100%"
              height="100%"
              rx="12"
              fill="${background}"
              stroke="${border}"
            />

            <!-- GitHub contribution calendar -->
            <g>
              ${cells
                .map(item => {
                  const x =
                    left +
                    item.col *
                      (cell + gap);

                  const y =
                    top +
                    item.row *
                      (cell + gap);

                  return `
                    <rect
                      x="${x}"
                      y="${y}"
                      width="${cell}"
                      height="${cell}"
                      rx="2.5"
                      fill="${colorFor(
                        item.count,
                        darkMode
                      )}"
                    >
                      <title>
                        ${xmlEscape(
                          `${item.date}: ${item.count} contribution${item.count === 1 ? '' : 's'}`
                        )}
                      </title>
                    </rect>
                  `;
                })
                .join('')}
            </g>

            <!-- Contribution cells behave as food -->
            <g>
              ${cells
                .filter(
                  item =>
                    item.count > 0
                )
                .map(item => {
                  const x =
                    left +
                    item.col *
                      (cell + gap) +
                    cell / 2;

                  const y =
                    top +
                    item.row *
                      (cell + gap) +
                    cell / 2;

                  return `
                    <circle
                      cx="${x}"
                      cy="${y}"
                      r="2"
                      fill="${foodColor}"
                      opacity="0.35"
                    >
                      <animate
                        attributeName="r"
                        values="1.4;2.8;1.4"
                        dur="1.4s"
                        repeatCount="indefinite"
                      />

                      <animate
                        attributeName="opacity"
                        values="0.25;0.8;0.25"
                        dur="1.4s"
                        repeatCount="indefinite"
                      />
                    </circle>
                  `;
                })
                .join('')}
            </g>

            <!--
              CONTINUOUS SNAKE BODY

              The polyline follows every cell in the
              contribution graph.

              stroke-dasharray controls how much of
              that path is visible.

              When the snake eats a contribution cell,
              lengthRatio increases, so the visible
              portion gets longer.
            -->
            <polyline
              points="${routePoints}"
              fill="none"
              stroke="${snakeColor}"
              stroke-width="7"
              stroke-linecap="round"
              stroke-linejoin="round"
              pathLength="1"
            >

              <!-- Growth -->
              <animate
                attributeName="stroke-dasharray"
                dur="${duration}"
                repeatCount="indefinite"
                calcMode="linear"
                values="${dashArrayValues}"
              />

              <!-- Tail movement -->
              <animate
                attributeName="stroke-dashoffset"
                dur="${duration}"
                repeatCount="indefinite"
                calcMode="linear"
                values="${dashOffsetValues}"
              />

            </polyline>

            <!-- Snake head -->
            <circle
              cx="${frames[0].headX}"
              cy="${frames[0].headY}"
              r="5.2"
              fill="${headColor}"
            >

              <animate
                attributeName="cx"
                dur="${duration}"
                repeatCount="indefinite"
                calcMode="linear"
                values="${headXValues}"
              />

              <animate
                attributeName="cy"
                dur="${duration}"
                repeatCount="indefinite"
                calcMode="linear"
                values="${headYValues}"
              />

            </circle>

            <!-- Snake eye -->
            <circle
              cx="${frames[0].headX - 1.8}"
              cy="${frames[0].headY - 1.8}"
              r="1.35"
              fill="#ffffff"
            >

              <animate
                attributeName="cx"
                dur="${duration}"
                repeatCount="indefinite"
                calcMode="linear"
                values="${eyeXValues}"
              />

              <animate
                attributeName="cy"
                dur="${duration}"
                repeatCount="indefinite"
                calcMode="linear"
                values="${eyeYValues}"
              />

            </circle>

            <!-- Footer -->
            <text
              x="${width / 2}"
              y="${height - 11}"
              text-anchor="middle"
              font-family="Arial, Helvetica, sans-serif"
              font-size="10"
              fill="${textColor}"
            >
              🐍 ${calendar.totalContributions.toLocaleString()} contributions • eat to grow
            </text>

          </svg>`;
          }

          async function main() {
            console.log(
              `Fetching contributions for ${USERNAME}...`
            );

            const data =
              await requestGraphQL();

            const calendar =
              data
                ?.user
                ?.contributionsCollection
                ?.contributionCalendar;

            if (!calendar) {
              throw new Error(
                'Contribution calendar tidak ditemukan.'
              );
            }

            console.log(
              `Total contributions: ${calendar.totalContributions}`
            );

            console.log(
              `Weeks: ${calendar.weeks.length}`
            );

            fs.mkdirSync(
              '/tmp/snake',
              { recursive: true }
            );

            fs.writeFileSync(
              '/tmp/snake/github-contribution-grid-snake.svg',
              buildSvg(
                calendar,
                false
              ),
              'utf8'
            );

            fs.writeFileSync(
              '/tmp/snake/github-contribution-grid-snake-dark.svg',
              buildSvg(
                calendar,
                true
              ),
              'utf8'
            );

            console.log(
              'Growing Snake berhasil dibuat.'
            );
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Publish to output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          GIT_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          rm -rf publish

          if git ls-remote \
            --exit-code \
            --heads \
            "$GIT_URL" \
            output >/dev/null 2>&1; then

            echo "Output branch exists."
            git clone \
              --depth 1 \
              --branch output \
              "$GIT_URL" \
              publish

          else

            echo "Creating output branch."

            mkdir publish
            cd publish

            git init
            git checkout --orphan output
            git remote add origin "$GIT_URL"

            cd ..

          fi

          cp \
            /tmp/snake/github-contribution-grid-snake.svg \
            publish/github-contribution-grid-snake.svg

          cp \
            /tmp/snake/github-contribution-grid-snake-dark.svg \
            publish/github-contribution-grid-snake-dark.svg

          touch publish/.nojekyll

          cd publish

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            github-contribution-grid-snake.svg \
            github-contribution-grid-snake-dark.svg \
            .nojekyll

          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi

          git commit \
            -m "Update growing contribution snake"

          git push origin output
