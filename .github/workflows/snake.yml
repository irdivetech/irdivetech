name: Custom Snake Game

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Snake Game
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: irdivetech
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("fs");
          const https = require("https");

          const TOKEN = process.env.GITHUB_TOKEN;
          const USERNAME = process.env.GITHUB_USERNAME;

          const GAME_COLUMNS = 42;
          const GAME_ROWS = 18;

          // 3 segments at the start, like classic Snake.
          const INITIAL_LENGTH = 3;

          // The snake moves every 0.15 second.
          const TICK_SECONDS = 0.15;

          // One short pause after eating before the next food appears.
          const FOOD_RESPAWN_PAUSE_TICKS = 1;

          // Small pause after death before a fresh game starts.
          const GAME_OVER_PAUSE_TICKS = 7;

          const MAX_TICKS = 360;

          // More random than a pure pathfinder, but still follows food.
          const RANDOM_TURN_CHANCE = 0.28;

          const DIRECTIONS = {
            up:    { x: 0,  y: -1 },
            down:  { x: 0,  y: 1 },
            left:  { x: -1, y: 0 },
            right: { x: 1,  y: 0 }
          };

          const OPPOSITE = {
            up: "down",
            down: "up",
            left: "right",
            right: "left"
          };

          const DIRECTION_NAMES = ["up", "down", "left", "right"];

          function key(point) {
            return `${point.x}:${point.y}`;
          }

          function inside(point) {
            return (
              point.x >= 0 &&
              point.x < GAME_COLUMNS &&
              point.y >= 0 &&
              point.y < GAME_ROWS
            );
          }

          function clonePoint(point) {
            return { x: point.x, y: point.y };
          }

          function mulberry32(seed) {
            return function random() {
              let t = seed += 0x6D2B79F5;
              t = Math.imul(t ^ (t >>> 15), t | 1);
              t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
              return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
          }

          function hashString(value) {
            let hash = 2166136261;

            for (let i = 0; i < value.length; i++) {
              hash ^= value.charCodeAt(i);
              hash = Math.imul(hash, 16777619);
            }

            return hash >>> 0;
          }

          function buildSeed(calendar) {
            const today = new Date().toISOString().slice(0, 10);

            const contributionSignature =
              calendar.weeks
                .flatMap(week => week.contributionDays)
                .map(day => `${day.date}:${day.contributionCount}`)
                .join("|");

            const source =
              `${USERNAME}:${today}:${calendar.totalContributions}:${contributionSignature}`;

            return hashString(source);
          }

          function nextPoint(head, direction) {
            const delta = DIRECTIONS[direction];

            return {
              x: head.x + delta.x,
              y: head.y + delta.y
            };
          }

          function isOpposite(a, b) {
            return OPPOSITE[a] === b;
          }

          function bodyContains(body, point, ignoreTail = false) {
            const limit =
              ignoreTail
                ? Math.max(0, body.length - 1)
                : body.length;

            for (let i = 0; i < limit; i++) {
              if (
                body[i].x === point.x &&
                body[i].y === point.y
              ) {
                return true;
              }
            }

            return false;
          }

          function manhattan(a, b) {
            return (
              Math.abs(a.x - b.x) +
              Math.abs(a.y - b.y)
            );
          }

          function safeDirections(
            head,
            body,
            currentDirection
          ) {
            const candidates = [];

            for (const direction of DIRECTION_NAMES) {
              if (
                DIRECTION_NAMES.length > 1 &&
                isOpposite(
                  direction,
                  currentDirection
                )
              ) {
                continue;
              }

              const next = nextPoint(
                head,
                direction
              );

              if (!inside(next)) {
                continue;
              }

              /*
               * The tail is about to move away during a normal
               * non-growth tick, so stepping into the current
               * tail is allowed.
               */
              const ignoresTail = true;

              if (
                bodyContains(
                  body,
                  next,
                  ignoresTail
                )
              ) {
                continue;
              }

              candidates.push({
                direction,
                point: next
              });
            }

            /*
             * If the snake is trapped, allow the reverse move
             * as a last resort.
             */
            if (candidates.length === 0) {
              const reverse = OPPOSITE[currentDirection];

              const next = nextPoint(
                head,
                reverse
              );

              if (
                inside(next) &&
                !bodyContains(body, next)
              ) {
                candidates.push({
                  direction: reverse,
                  point: next
                });
              }
            }

            return candidates;
          }

          /*
           * Breadth-first search from the current head to food.
           *
           * Returns the first direction on the shortest available
           * path, while avoiding the current body.
           */
          function bfsFirstDirection(
            head,
            body,
            food,
            currentDirection
          ) {
            if (!food) {
              return null;
            }

            const startKey = key(head);
            const queue = [head];
            const visited = new Set([startKey]);

            const previous = new Map();

            while (queue.length > 0) {
              const current =
                queue.shift();

              if (
                current.x === food.x &&
                current.y === food.y
              ) {
                break;
              }

              const directions = [
                "up",
                "right",
                "down",
                "left"
              ];

              /*
               * Slight directional shuffle prevents identical
               * looking paths every run.
               */
              const ordered = directions
                .filter(
                  direction =>
                    direction !== OPPOSITE[currentDirection]
                );

              for (const direction of ordered) {
                const next =
                  nextPoint(
                    current,
                    direction
                  );

                if (!inside(next)) {
                  continue;
                }

                if (bodyContains(body, next, true)) {
                  continue;
                }

                const nextKey = key(next);

                if (visited.has(nextKey)) {
                  continue;
                }

                visited.add(nextKey);

                previous.set(nextKey, {
                  from: current,
                  direction
                });

                queue.push(next);
              }
            }

            const foodKey = key(food);

            if (!visited.has(foodKey)) {
              return null;
            }

            let cursor = food;
            let firstDirection = null;

            while (key(cursor) !== startKey) {
              const step =
                previous.get(key(cursor));

              if (!step) {
                return null;
              }

              firstDirection =
                step.direction;

              cursor = step.from;
            }

            return firstDirection;
          }

          function chooseDirection(
            head,
            body,
            food,
            currentDirection,
            random
          ) {
            const safe =
              safeDirections(
                head,
                body,
                currentDirection
              );

            if (safe.length === 0) {
              return currentDirection;
            }

            const foodDirection =
              bfsFirstDirection(
                head,
                body,
                food,
                currentDirection
              );

            /*
             * Usually follow the food.
             */
            if (
              foodDirection &&
              random() > RANDOM_TURN_CHANCE
            ) {
              return foodDirection;
            }

            /*
             * Otherwise wander among safe moves,
             * preferring directions that are not wildly
             * farther from the current food.
             */
            if (food) {
              const scored =
                safe.map(option => ({
                  ...option,
                  distance:
                    manhattan(
                      option.point,
                      food
                    )
                }));

              const bestDistance =
                Math.min(
                  ...scored.map(
                    option =>
                      option.distance
                  )
                );

              const relaxed =
                scored.filter(
                  option =>
                    option.distance <=
                    bestDistance + 3
                );

              return relaxed[
                Math.floor(
                  random() * relaxed.length
                )
              ].direction;
            }

            return safe[
              Math.floor(
                random() * safe.length
              )
            ].direction;
          }

          function spawnFood(
            snake,
            random,
            recentFoods,
            head
          ) {
            const occupied =
              new Set(
                snake.map(key)
              );

            /*
             * Avoid the last few food positions so
             * the new food doesn't appear in the same
             * couple of cells over and over.
             */
            const recent =
              new Set(
                recentFoods.slice(-8)
              );

            const possible = [];

            for (let y = 0; y < GAME_ROWS; y++) {
              for (
                let x = 0;
                x < GAME_COLUMNS;
                x++
              ) {
                const point = { x, y };
                const pointKey = key(point);

                if (occupied.has(pointKey)) {
                  continue;
                }

                if (recent.has(pointKey)) {
                  continue;
                }

                /*
                 * Don't spawn directly next to the head.
                 * This gives the game a little breathing room.
                 */
                if (
                  manhattan(
                    point,
                    head
                  ) < 5
                ) {
                  continue;
                }

                possible.push(point);
              }
            }

            /*
             * Fallback if the board gets crowded.
             */
            if (possible.length === 0) {
              for (
                let y = 0;
                y < GAME_ROWS;
                y++
              ) {
                for (
                  let x = 0;
                  x < GAME_COLUMNS;
                  x++
                ) {
                  const point = { x, y };

                  if (
                    !occupied.has(
                      key(point)
                    )
                  ) {
                    possible.push(point);
                  }
                }
              }
            }

            if (possible.length === 0) {
              return null;
            }

            const food =
              possible[
                Math.floor(
                  random() *
                  possible.length
                )
              ];

            recentFoods.push(
              key(food)
            );

            return food;
          }

          function createInitialSnake(random) {
            const centerY =
              Math.floor(
                GAME_ROWS / 2
              );

            const startX =
              Math.floor(
                GAME_COLUMNS / 3
              );

            /*
             * Head first.
             */
            const snake = [
              { x: startX + 2, y: centerY },
              { x: startX + 1, y: centerY },
              { x: startX, y: centerY }
            ];

            /*
             * Mostly start moving right, but allow
             * slight variation between runs.
             */
            const possible =
              ["right", "down", "up"];

            const direction =
              possible[
                Math.floor(
                  random() * possible.length
                )
              ];

            return {
              snake,
              direction
            };
          }

          function snapshot(
            snake,
            food,
            event = null
          ) {
            return {
              snake:
                snake.map(clonePoint),
              food:
                food
                  ? clonePoint(food)
                  : null,
              event
            };
          }

          function simulate(calendar) {
            const seed =
              buildSeed(calendar);

            const random =
              mulberry32(seed);

            console.log(
              `Simulation seed: ${seed}`
            );

            let {
              snake,
              direction
            } =
              createInitialSnake(random);

            const recentFoods = [];

            let food =
              spawnFood(
                snake,
                random,
                recentFoods,
                snake[0]
              );

            const frames = [];

            let foodsEaten = 0;
            let maxLength = snake.length;

            /*
             * A little intro pause so the viewer can
             * see the initial food placement.
             */
            frames.push(
              snapshot(
                snake,
                food
              )
            );

            for (
              let tick = 0;
              tick < MAX_TICKS;
              tick++
            ) {
              if (!food) {
                food =
                  spawnFood(
                    snake,
                    random,
                    recentFoods,
                    snake[0]
                  );
              }

              direction =
                chooseDirection(
                  snake[0],
                  snake,
                  food,
                  direction,
                  random
                );

              const currentHead =
                snake[0];

              const nextHead =
                nextPoint(
                  currentHead,
                  direction
                );

              const hitsWall =
                !inside(nextHead);

              /*
               * Determine whether the move grows
               * before checking the tail collision.
               */
              const eatsFood =
                food &&
                nextHead.x === food.x &&
                nextHead.y === food.y;

              const hitsBody =
                bodyContains(
                  snake,
                  nextHead,
                  !eatsFood
                );

              if (
                hitsWall ||
                hitsBody
              ) {
                /*
                 * One dead frame.
                 */
                frames.push(
                  snapshot(
                    snake,
                    null,
                    "game-over"
                  )
                );

                /*
                 * Game-over pause.
                 */
                for (
                  let pause = 0;
                  pause < GAME_OVER_PAUSE_TICKS;
                  pause++
                ) {
                  frames.push(
                    snapshot(
                      snake,
                      null,
                      "game-over"
                    )
                  );
                }

                /*
                 * New game.
                 */
                const restarted =
                  createInitialSnake(
                    random
                  );

                snake =
                  restarted.snake;

                direction =
                  restarted.direction;

                food =
                  spawnFood(
                    snake,
                    random,
                    recentFoods,
                    snake[0]
                  );

                frames.push(
                  snapshot(
                    snake,
                    food,
                    "restart"
                  )
                );

                continue;
              }

              /*
               * Move head.
               */
              const nextSnake = [
                nextHead,
                ...snake
              ];

              if (eatsFood) {
                /*
                 * Do NOT remove the tail.
                 * Therefore snake grows by exactly
                 * one segment.
                 */
                foodsEaten++;

                maxLength =
                  Math.max(
                    maxLength,
                    nextSnake.length
                  );

                food = null;

                /*
                 * Food disappears exactly on the
                 * frame where the head reaches it.
                 */
                frames.push(
                  snapshot(
                    nextSnake,
                    null,
                    "eat"
                  )
                );

                /*
                 * Short pause, then spawn food
                 * somewhere else.
                 */
                for (
                  let pause = 0;
                  pause <
                  FOOD_RESPAWN_PAUSE_TICKS;
                  pause++
                ) {
                  frames.push(
                    snapshot(
                      nextSnake,
                      null,
                      "food-respawn"
                    )
                  );
                }

                food =
                  spawnFood(
                    nextSnake,
                    random,
                    recentFoods,
                    nextSnake[0]
                  );

                frames.push(
                  snapshot(
                    nextSnake,
                    food,
                    "new-food"
                  )
                );

                snake =
                  nextSnake;

                continue;
              }

              /*
               * Normal movement:
               * remove the tail.
               */
              nextSnake.pop();

              snake =
                nextSnake;

              frames.push(
                snapshot(
                  snake,
                  food
                )
              );

              maxLength =
                Math.max(
                  maxLength,
                  snake.length
                );
            }

            console.log(
              `Generated frames: ${frames.length}`
            );

            console.log(
              `Max snake length: ${maxLength}`
            );

            console.log(
              `Food eaten: ${foodsEaten}`
            );

            return {
              frames,
              seed,
              foodsEaten,
              maxLength
            };
          }

          function contributionColor(
            count,
            dark
          ) {
            if (dark) {
              if (count === 0) return "#161b22";
              if (count <= 2) return "#0e4429";
              if (count <= 5) return "#006d32";
              if (count <= 9) return "#26a641";
              return "#39d353";
            }

            if (count === 0) return "#ebedf0";
            if (count <= 2) return "#9be9a8";
            if (count <= 5) return "#40c463";
            if (count <= 9) return "#30a14e";
            return "#216e39";
          }

          function buildSvg(
            simulation,
            calendar,
            dark
          ) {
            const frames =
              simulation.frames;

            /*
             * UI dimensions.
             */
            const cell = 12;
            const gap = 2;

            const left = 22;
            const top = 22;
            const right = 22;
            const bottom = 22;

            const width =
              left +
              GAME_COLUMNS *
                (cell + gap) -
              gap +
              right;

            const height =
              top +
              GAME_ROWS *
                (cell + gap) -
              gap +
              bottom;

            const background =
              dark
                ? "#000000"
                : "#000000";

            const border =
              dark
                ? "#123B5A"
                : "#123B5A";

            const snakeColor =
              dark
                ? "#39FF14"
                : "#39FF14";

            const headColor =
              dark
                ? "#7CFF5B"
                : "#7CFF5B";

            const foodColor =
              dark
                ? "#FF2525"
                : "#FF2525";

            const maxSegments =
              Math.max(
                INITIAL_LENGTH,
                ...frames.map(
                  frame =>
                    frame.snake.length
                )
              );

            /*
             * One tick = 0.15 second.
             */
            const duration =
              `${(
                frames.length *
                TICK_SECONDS
              ).toFixed(2)}s`;

            function valuesForSegment(
              segmentIndex,
              axis
            ) {
              return frames
                .map(frame => {
                  const point =
                    frame.snake[
                      segmentIndex
                    ];

                  if (!point) {
                    return -100;
                  }

                  const value =
                    axis === "x"
                      ? left +
                        point.x *
                          (cell + gap)
                      : top +
                        point.y *
                          (cell + gap);

                  return value;
                })
                .join(";");
            }

            function opacityForSegment(
              segmentIndex
            ) {
              return frames
                .map(frame =>
                  frame.snake[
                    segmentIndex
                  ]
                    ? 1
                    : 0
                )
                .join(";");
            }

            const foodX =
              frames
                .map(frame =>
                  frame.food
                    ? left +
                      frame.food.x *
                        (cell + gap)
                    : -100
                )
                .join(";");

            const foodY =
              frames
                .map(frame =>
                  frame.food
                    ? top +
                      frame.food.y *
                        (cell + gap)
                    : -100
                )
                .join(";");

            const foodOpacity =
              frames
                .map(frame =>
                  frame.food
                    ? 1
                    : 0
                )
                .join(";");

            /*
             * Render the background.
             *
             * No contribution graph is shown.
             * Contributions only determine the simulation seed.
             */
            const parts = [];

            parts.push(`
              <rect
                x="0"
                y="0"
                width="${width}"
                height="${height}"
                rx="8"
                fill="${background}"
                stroke="${border}"
                stroke-width="3"
              />
            `);

            /*
             * Subtle inner game-area border.
             */
            parts.push(`
              <rect
                x="${left - 8}"
                y="${top - 8}"
                width="${
                  GAME_COLUMNS *
                    (cell + gap) -
                  gap +
                  16
                }"
                height="${
                  GAME_ROWS *
                    (cell + gap) -
                  gap +
                  16
                }"
                rx="3"
                fill="none"
                stroke="#061A29"
                stroke-width="1"
              />
            `);

            /*
             * Snake body.
             *
             * We render tail first and head last,
             * so the head always appears on top.
             */
            for (
              let segmentIndex =
                maxSegments - 1;
              segmentIndex >= 1;
              segmentIndex--
            ) {
              const xValues =
                valuesForSegment(
                  segmentIndex,
                  "x"
                );

              const yValues =
                valuesForSegment(
                  segmentIndex,
                  "y"
                );

              const opacityValues =
                opacityForSegment(
                  segmentIndex
                );

              parts.push(`
                <rect
                  x="${left}"
                  y="${top}"
                  width="${cell}"
                  height="${cell}"
                  rx="1"
                  fill="${snakeColor}"
                  opacity="0"
                  shape-rendering="crispEdges"
                >
                  <animate
                    attributeName="x"
                    dur="${duration}"
                    repeatCount="indefinite"
                    calcMode="discrete"
                    values="${xValues}"
                  />

                  <animate
                    attributeName="y"
                    dur="${duration}"
                    repeatCount="indefinite"
                    calcMode="discrete"
                    values="${yValues}"
                  />

                  <animate
                    attributeName="opacity"
                    dur="${duration}"
                    repeatCount="indefinite"
                    calcMode="discrete"
                    values="${opacityValues}"
                  />
                </rect>
              `);
            }

            /*
             * Food.
             *
             * When the head reaches food:
             * opacity becomes 0 immediately.
             *
             * Then a new food position appears after
             * the short respawn pause.
             */
            parts.push(`
              <rect
                x="${left}"
                y="${top}"
                width="${cell}"
                height="${cell}"
                rx="1"
                fill="${foodColor}"
                shape-rendering="crispEdges"
              >
                <animate
                  attributeName="x"
                  dur="${duration}"
                  repeatCount="indefinite"
                  calcMode="discrete"
                  values="${foodX}"
                />

                <animate
                  attributeName="y"
                  dur="${duration}"
                  repeatCount="indefinite"
                  calcMode="discrete"
                  values="${foodY}"
                />

                <animate
                  attributeName="opacity"
                  dur="${duration}"
                  repeatCount="indefinite"
                  calcMode="discrete"
                  values="${foodOpacity}"
                />
              </rect>
            `);

            /*
             * Head.
             */
            const headX =
              frames
                .map(frame => {
                  const point =
                    frame.snake[0];

                  return left +
                    point.x *
                      (cell + gap);
                })
                .join(";");

            const headY =
              frames
                .map(frame => {
                  const point =
                    frame.snake[0];

                  return top +
                    point.y *
                      (cell + gap);
                })
                .join(";");

            parts.push(`
              <rect
                x="${left}"
                y="${top}"
                width="${cell}"
                height="${cell}"
                rx="1"
                fill="${headColor}"
                shape-rendering="crispEdges"
              >
                <animate
                  attributeName="x"
                  dur="${duration}"
                  repeatCount="indefinite"
                  calcMode="discrete"
                  values="${headX}"
                />

                <animate
                  attributeName="y"
                  dur="${duration}"
                  repeatCount="indefinite"
                  calcMode="discrete"
                  values="${headY}"
                />
              </rect>
            `);

            /*
             * Tiny eye/highlight.
             */
            const eyeX =
              frames
                .map(frame => {
                  const point =
                    frame.snake[0];

                  return (
                    left +
                    point.x *
                      (cell + gap) +
                    8
                  );
                })
                .join(";");

            const eyeY =
              frames
                .map(frame => {
                  const point =
                    frame.snake[0];

                  return (
                    top +
                    point.y *
                      (cell + gap) +
                    2
                  );
                })
                .join(";");

            parts.push(`
              <rect
                x="${eyeX.split(";")[0]}"
                y="${eyeY.split(";")[0]}"
                width="2"
                height="2"
                fill="#001400"
              >
                <animate
                  attributeName="x"
                  dur="${duration}"
                  repeatCount="indefinite"
                  calcMode="discrete"
                  values="${eyeX}"
                />

                <animate
                  attributeName="y"
                  dur="${duration}"
                  repeatCount="indefinite"
                  calcMode="discrete"
                  values="${eyeY}"
                />
              </rect>
            `);

            /*
             * Very small score label, deliberately subtle.
             */
            parts.push(`
              <text
                x="${width - 18}"
                y="14"
                text-anchor="end"
                font-family="monospace"
                font-size="8"
                fill="#27516D"
              >
                IRDIVETECH // SNAKE
              </text>
            `);

            /*
             * Use contribution count only as metadata,
             * not as a visible board.
             */
            parts.push(`
              <title>
                IrDiveTech Snake Game • ${calendar.totalContributions} GitHub contributions • ${simulation.foodsEaten} food eaten in this run
              </title>
            `);

            return `<?xml version="1.0" encoding="UTF-8"?>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="${width}"
            height="${height}"
            viewBox="0 0 ${width} ${height}"
            role="img"
            aria-label="IrDiveTech animated Snake game"
          >
            ${parts.join("\n")}
          </svg>`;
          }

          async function requestGraphQL() {
            return new Promise(
              (resolve, reject) => {
                const query = `
                  query($login: String!) {
                    user(login: $login) {
                      contributionsCollection {
                        contributionCalendar {
                          totalContributions
                          weeks {
                            contributionDays {
                              date
                              contributionCount
                              weekday
                            }
                          }
                        }
                      }
                    }
                  }
                `;

                const body =
                  JSON.stringify({
                    query,
                    variables: {
                      login: USERNAME
                    }
                  });

                const request =
                  https.request(
                    {
                      hostname:
                        "api.github.com",
                      path: "/graphql",
                      method: "POST",
                      headers: {
                        Authorization:
                          `Bearer ${TOKEN}`,
                        "Content-Type":
                          "application/json",
                        "User-Agent":
                          "irdivetech-snake",
                        "Content-Length":
                          Buffer.byteLength(body)
                      }
                    },
                    response => {
                      let output = "";

                      response.on(
                        "data",
                        chunk => {
                          output += chunk;
                        }
                      );

                      response.on(
                        "end",
                        () => {
                          try {
                            const parsed =
                              JSON.parse(output);

                            if (
                              response.statusCode <
                                200 ||
                              response.statusCode >=
                                300
                            ) {
                              reject(
                                new Error(
                                  `GitHub API HTTP ${response.statusCode}: ${output}`
                                )
                              );
                              return;
                            }

                            if (
                              parsed.errors
                            ) {
                              reject(
                                new Error(
                                  JSON.stringify(
                                    parsed.errors
                                  )
                                )
                              );
                              return;
                            }

                            resolve(
                              parsed.data
                            );
                          } catch (
                            error
                          ) {
                            reject(error);
                          }
                        }
                      );
                    }
                  );

                request.on(
                  "error",
                  reject
                );

                request.write(body);
                request.end();
              }
            );
          }

          async function main() {
            if (!TOKEN) {
              throw new Error(
                "GITHUB_TOKEN tidak tersedia."
              );
            }

            console.log(
              `Loading contribution data for ${USERNAME}...`
            );

            const data =
              await requestGraphQL();

            const calendar =
              data
                ?.user
                ?.contributionsCollection
                ?.contributionCalendar;

            if (!calendar) {
              throw new Error(
                "Contribution calendar tidak ditemukan."
              );
            }

            console.log(
              `Total contributions: ${calendar.totalContributions}`
            );

            console.log(
              `Weeks: ${calendar.weeks.length}`
            );

            const simulation =
              simulate(calendar);

            const lightSvg =
              buildSvg(
                simulation,
                calendar,
                false
              );

            const darkSvg =
              buildSvg(
                simulation,
                calendar,
                true
              );

            fs.mkdirSync(
              "/tmp/snake",
              {
                recursive: true
              }
            );

            fs.writeFileSync(
              "/tmp/snake/github-contribution-grid-snake.svg",
              lightSvg,
              "utf8"
            );

            fs.writeFileSync(
              "/tmp/snake/github-contribution-grid-snake-dark.svg",
              darkSvg,
              "utf8"
            );

            console.log(
              "Snake SVG berhasil dibuat."
            );
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Publish Snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          rm -rf publish

          if git ls-remote \
            --exit-code \
            --heads \
            "$REPO_URL" \
            output >/dev/null 2>&1; then

            git clone \
              --depth 1 \
              --branch output \
              "$REPO_URL" \
              publish

            cd publish

            cd ..

          else

            mkdir publish
            cd publish

            git init
            git checkout --orphan output
            git remote add origin "$REPO_URL"

            cd ..

          fi

          cp \
            /tmp/snake/github-contribution-grid-snake.svg \
            publish/github-contribution-grid-snake.svg

          cp \
            /tmp/snake/github-contribution-grid-snake-dark.svg \
            publish/github-contribution-grid-snake-dark.svg

          touch publish/.nojekyll

          cd publish

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            github-contribution-grid-snake.svg \
            github-contribution-grid-snake-dark.svg \
            .nojekyll

          if git diff \
            --cached \
            --quiet; then

            echo "No changes to publish."
            exit 0
          fi

          git commit \
            -m "Update Snake Game"

          git push \
            origin \
            output
