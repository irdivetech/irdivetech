name: Custom Snake Game

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate animated Snake game
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: irdivetech
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('fs');
          const https = require('https');

          const TOKEN = process.env.GITHUB_TOKEN;
          const USERNAME = process.env.GITHUB_USERNAME;

          if (!TOKEN) {
            throw new Error('GITHUB_TOKEN tidak tersedia.');
          }

          const query = `
            query($login: String!) {
              user(login: $login) {
                contributionsCollection {
                  contributionCalendar {
                    totalContributions
                    weeks {
                      contributionDays {
                        date
                        contributionCount
                        weekday
                      }
                    }
                  }
                }
              }
            }
          `;

          function githubGraphQL() {
            return new Promise((resolve, reject) => {
              const body = JSON.stringify({
                query,
                variables: { login: USERNAME }
              });

              const req = https.request(
                {
                  hostname: 'api.github.com',
                  path: '/graphql',
                  method: 'POST',
                  headers: {
                    Authorization: `Bearer ${TOKEN}`,
                    'Content-Type': 'application/json',
                    'User-Agent': 'irdivetech-snake-game',
                    'Content-Length': Buffer.byteLength(body)
                  }
                },
                res => {
                  let response = '';

                  res.on('data', chunk => {
                    response += chunk;
                  });

                  res.on('end', () => {
                    try {
                      const parsed = JSON.parse(response);

                      if (res.statusCode < 200 || res.statusCode >= 300) {
                        reject(
                          new Error(
                            `GitHub GraphQL HTTP ${res.statusCode}: ${response}`
                          )
                        );
                        return;
                      }

                      if (parsed.errors) {
                        reject(
                          new Error(
                            `GitHub GraphQL error: ${JSON.stringify(parsed.errors)}`
                          )
                        );
                        return;
                      }

                      resolve(parsed.data);
                    } catch (error) {
                      reject(error);
                    }
                  });
                }
              );

              req.on('error', reject);
              req.write(body);
              req.end();
            });
          }

          function escapeXml(value) {
            return String(value)
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
              .replace(/"/g, '&quot;')
              .replace(/'/g, '&apos;');
          }

          function mulberry32(seed) {
            return function random() {
              let t = (seed += 0x6D2B79F5);
              t = Math.imul(t ^ (t >>> 15), t | 1);
              t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
              return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
          }

          function shuffle(array, random) {
            const copy = array.slice();
            for (let i = copy.length - 1; i > 0; i--) {
              const j = Math.floor(random() * (i + 1));
              [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
          }

          function key(cell) {
            return `${cell.x}:${cell.y}`;
          }

          function same(a, b) {
            return a.x === b.x && a.y === b.y;
          }

          function inside(x, y, cols, rows) {
            return x >= 0 && x < cols && y >= 0 && y < rows;
          }

          function neighbors(cell, cols, rows, random) {
            const dirs = shuffle(
              [
                [1, 0],
                [-1, 0],
                [0, 1],
                [0, -1]
              ],
              random
            );

            return dirs
              .map(([dx, dy]) => ({
                x: cell.x + dx,
                y: cell.y + dy
              }))
              .filter(p => inside(p.x, p.y, cols, rows));
          }

          function reachableFrom(start, blocked, cols, rows, random) {
            const queue = [start];
            const visited = new Set([key(start)]);
            const result = [];

            while (queue.length) {
              const current = queue.shift();
              result.push(current);

              for (const next of neighbors(current, cols, rows, random)) {
                const nextKey = key(next);

                if (visited.has(nextKey) || blocked.has(nextKey)) {
                  continue;
                }

                visited.add(nextKey);
                queue.push(next);
              }
            }

            return result;
          }

          /*
           * BFS from the food to the head.
           * This lets the snake follow a real route to the food instead
           * of blindly moving across the contribution calendar.
           */
          function nextStepTowardFood(head, food, body, growing, cols, rows, random) {
            /*
             * BFS starts at the HEAD and finds the shortest safe route
             * to the current food. We then return only the FIRST STEP,
             * so every frame moves exactly one grid cell.
             */
            const blocked = new Set();

            const obstacleBody = growing
              ? body
              : body.slice(0, Math.max(1, body.length - 1));

            for (const part of obstacleBody) {
              blocked.add(key(part));
            }

            blocked.delete(key(head));
            blocked.delete(key(food));

            const queue = [head];
            const cameFrom = new Map();
            const visited = new Set([key(head)]);

            while (queue.length) {
              const current = queue.shift();

              if (same(current, food)) {
                break;
              }

              const options = shuffle(
                neighbors(current, cols, rows, random),
                random
              );

              for (const next of options) {
                const nextKey = key(next);

                if (visited.has(nextKey) || blocked.has(nextKey)) {
                  continue;
                }

                visited.add(nextKey);
                cameFrom.set(nextKey, current);
                queue.push(next);
              }
            }

            const foodKey = key(food);

            if (!visited.has(foodKey)) {
              return null;
            }

            let cursor = food;
            let previous = cameFrom.get(foodKey);
            let safety = 0;

            while (previous && !same(previous, head) && safety < cols * rows) {
              cursor = previous;
              previous = cameFrom.get(key(cursor));
              safety += 1;
            }

            if (!previous || !same(previous, head)) {
              return null;
            }

            return cursor;
          }

          function pickFood(head, body, cols, rows, random, recentFoodKeys = new Set()) {
            const blocked = new Set(body.map(key));

            const reachable = reachableFrom(
              head,
              blocked,
              cols,
              rows,
              random
            );

            /*
             * Do not immediately reuse recent food locations.
             * This makes each respawn feel like a genuinely new target.
             */
            const fresh = reachable.filter(cell => {
              const distance =
                Math.abs(cell.x - head.x) +
                Math.abs(cell.y - head.y);

              return distance >= 5 && !recentFoodKeys.has(key(cell));
            });

            const distant = reachable.filter(cell => {
              const distance =
                Math.abs(cell.x - head.x) +
                Math.abs(cell.y - head.y);

              return distance >= 5;
            });

            const source = fresh.length
              ? fresh
              : (distant.length ? distant : reachable);

            if (!source.length) {
              throw new Error('Tidak ada cell aman untuk makanan baru.');
            }

            const shuffled = shuffle(source, random);
            return shuffled[Math.floor(random() * shuffled.length)];
          }

          function contributionColor(count, darkMode) {
            if (darkMode) {
              if (count === 0) return '#161b22';
              if (count <= 2) return '#0e4429';
              if (count <= 5) return '#006d32';
              if (count <= 9) return '#26a641';
              return '#39d353';
            }

            if (count === 0) return '#ebedf0';
            if (count <= 2) return '#9be9a8';
            if (count <= 5) return '#40c463';
            if (count <= 9) return '#30a14e';
            return '#216e39';
          }

          function simulate(calendar, seed) {
            const cols = calendar.weeks.length;
            const rows = 7;
            const random = mulberry32(seed);

            const center = {
              x: Math.floor(cols / 2),
              y: Math.floor(rows / 2)
            };

            let body = [
              center,
              { x: center.x - 1, y: center.y },
              { x: center.x - 2, y: center.y }
            ];

            let food = pickFood(
              body[0],
              body,
              cols,
              rows,
              random
            );

            let growthRemaining = 0;
            let score = 0;
            let foodsEaten = 0;

            /* Keep a short memory so new food keeps appearing elsewhere. */
            const recentFoodKeys = new Set([key(food)]);
            const rememberFood = position => {
              recentFoodKeys.add(key(position));

              while (recentFoodKeys.size > 8) {
                const oldest = recentFoodKeys.values().next().value;
                recentFoodKeys.delete(oldest);
              }
            };

            const frames = [];

            /*
             * ~30-40 seconds depending on route length.
             * We intentionally create more food than the old design so
             * the game keeps changing instead of bouncing between 2 spots.
             */
            const MAX_FRAMES = 260;
            const MAX_FOODS = 18;

            for (let step = 0; step < MAX_FRAMES; step++) {
              const growing = growthRemaining > 0;

              let next = nextStepTowardFood(
                body[0],
                food,
                body,
                growing,
                cols,
                rows,
                random
              );

              /*
               * If the shortest route is blocked, pick a safe neighbouring
               * cell while still preferring cells that are closer to food.
               */
              if (!next) {
                const blocked = new Set(
                  (growing
                    ? body
                    : body.slice(0, Math.max(1, body.length - 1))
                  ).map(key)
                );

                blocked.delete(key(body[0]));

                const safe = neighbors(
                  body[0],
                  cols,
                  rows,
                  random
                ).filter(cell => !blocked.has(key(cell)));

                if (!safe.length) {
                  /* Rare emergency: restart in a fresh location. */
                  const restart = {
                    x: 2 + Math.floor(random() * Math.max(1, cols - 4)),
                    y: 1 + Math.floor(random() * Math.max(1, rows - 2))
                  };

                  body = [
                    restart,
                    { x: Math.max(0, restart.x - 1), y: restart.y },
                    { x: Math.max(0, restart.x - 2), y: restart.y }
                  ];

                  growthRemaining = 0;
                  food = pickFood(
                    body[0],
                    body,
                    cols,
                    rows,
                    random,
                    recentFoodKeys
                  );
                  rememberFood(food);

                  step += 1;
                  continue;
                }

                safe.sort((a, b) => {
                  const da =
                    Math.abs(a.x - food.x) +
                    Math.abs(a.y - food.y);
                  const db =
                    Math.abs(b.x - food.x) +
                    Math.abs(b.y - food.y);
                  return da - db;
                });

                /* Small randomisation so turns are not perfectly predictable. */
                next =
                  random() < 0.22 && safe.length > 1
                    ? safe[Math.floor(random() * Math.min(2, safe.length))]
                    : safe[0];
              }

              const nextBody = [next, ...body];
              const ate = same(next, food);

              if (ate) {
                score += 1;
                foodsEaten += 1;
                growthRemaining += 2;

                if (foodsEaten >= MAX_FOODS) {
                  /* After the last planned food, immediately place another. */
                  foodsEaten = 0;
                }

                food = pickFood(
                  next,
                  nextBody,
                  cols,
                  rows,
                  random,
                  recentFoodKeys
                );
                rememberFood(food);
              }

              if (growthRemaining > 0) {
                growthRemaining -= 1;
              } else {
                nextBody.pop();
              }

              body = nextBody;

              frames.push({
                body: body.map(part => ({ ...part })),
                food: { ...food },
                ate,
                score,
                length: body.length
              });
            }

            return {
              frames,
              cols,
              rows
            };
          }

          function buildSvg(calendar, simulation, darkMode) {
            const cols = simulation.cols;
            const rows = simulation.rows;
            const frames = simulation.frames;

            const cell = 11;
            const gap = 3;

            const left = 18;
            const top = 18;
            const right = 18;
            const bottom = 38;

            const width =
              left +
              cols * (cell + gap) -
              gap +
              right;

            const height =
              top +
              rows * (cell + gap) -
              gap +
              bottom;

            const durationMs = frames.length * 165;
            const duration = `${durationMs}ms`;
            const bg = darkMode ? '#0d1117' : '#ffffff';
            const border = darkMode ? '#30363d' : '#d0d7de';
            const snake = darkMode ? '#58a6ff' : '#0969da';
            const snakeHead = darkMode ? '#79c0ff' : '#0550ae';
            const text = darkMode ? '#8b949e' : '#57606a';

            const xFor = cellData =>
              left +
              cellData.x * (cell + gap) +
              cell / 2;

            const yFor = cellData =>
              top +
              cellData.y * (cell + gap) +
              cell / 2;

            const maxLength = Math.max(
              3,
              ...frames.map(frame => frame.body.length)
            );

            const headXValues = frames
              .map(frame => xFor(frame.body[0]))
              .join(';');

            const headYValues = frames
              .map(frame => yFor(frame.body[0]))
              .join(';');

            const eyeXValues = frames
              .map(frame => xFor(frame.body[0]) - 1.8)
              .join(';');

            const eyeYValues = frames
              .map(frame => yFor(frame.body[0]) - 1.8)
              .join(';');

            /* Food moves and respawns after every eat. */
            const foodTransforms = frames
              .map(frame =>
                `translate(${xFor(frame.food)} ${yFor(frame.food)})`
              )
              .join(';');

            const foodOpacity = frames
              .map(frame => (frame.ate ? 0 : 1))
              .join(';');

            const foodScale = frames
              .map(frame => (frame.ate ? 0.4 : 1))
              .join(';');

            const parts = [];

            parts.push(`
              <rect
                width="100%"
                height="100%"
                rx="12"
                fill="${bg}"
                stroke="${border}"
              />
            `);

            /* GitHub contribution board remains as the game board. */
            parts.push(`
              <g>
                ${calendar.weeks
                  .map((week, col) =>
                    week.contributionDays
                      .map(day => {
                        const x =
                          left +
                          col * (cell + gap);
                        const y =
                          top +
                          day.weekday * (cell + gap);

                        return `
                          <rect
                            x="${x}"
                            y="${y}"
                            width="${cell}"
                            height="${cell}"
                            rx="2.5"
                            fill="${contributionColor(
                              day.contributionCount,
                              darkMode
                            )}"
                          >
                            <title>${escapeXml(
                              `${day.date}: ${day.contributionCount} contribution${day.contributionCount === 1 ? '' : 's'}`
                            )}</title>
                          </rect>
                        `;
                      })
                      .join('')
                  )
                  .join('')}
              </g>
            `);

            /* Moving food: a little apple-like token. */
            parts.push(`
              <g transform="translate(${xFor(frames[0].food)} ${yFor(frames[0].food)})">
                <circle
                  cx="0"
                  cy="1"
                  r="5"
                  fill="#ff5f56"
                />
                <circle
                  cx="-1.8"
                  cy="-0.8"
                  r="1.35"
                  fill="#ffffff"
                  opacity="0.85"
                />
                <path
                  d="M 0 -3.5 C 1 -6, 4 -6, 5 -4"
                  fill="none"
                  stroke="#39d353"
                  stroke-width="1.5"
                  stroke-linecap="round"
                />
                <animateTransform
                  attributeName="transform"
                  attributeType="XML"
                  type="translate"
                  dur="${duration}"
                  repeatCount="indefinite"
                  calcMode="linear"
                  values="${foodTransforms}"
                />
                <animate
                  attributeName="opacity"
                  dur="${duration}"
                  repeatCount="indefinite"
                  calcMode="discrete"
                  values="${foodOpacity}"
                />
                <animateTransform
                  attributeName="transform"
                  attributeType="XML"
                  type="scale"
                  additive="sum"
                  dur="${duration}"
                  repeatCount="indefinite"
                  calcMode="discrete"
                  values="${foodScale}"
                />
              </g>
            `);

            /*
             * Every body segment is animated independently.
             * This makes actual growth visible when food is eaten.
             */
            for (let segment = maxLength - 1; segment >= 0; segment--) {
              const cx = [];
              const cy = [];
              const opacity = [];

              for (const frame of frames) {
                const part = frame.body[segment];

                if (!part) {
                  cx.push(xFor(frame.body[0]));
                  cy.push(yFor(frame.body[0]));
                  opacity.push(0);
                } else {
                  cx.push(xFor(part));
                  cy.push(yFor(part));
                  opacity.push(1);
                }
              }

              const radius = segment === 0 ? 5.2 : 4.2;
              const color = segment === 0 ? snakeHead : snake;

              parts.push(`
                <circle
                  cx="${cx[0]}"
                  cy="${cy[0]}"
                  r="${radius}"
                  fill="${color}"
                  opacity="${opacity[0]}"
                >
                  <animate
                    attributeName="cx"
                    dur="${duration}"
                    repeatCount="indefinite"
                    calcMode="linear"
                    values="${cx.join(';')}"
                  />
                  <animate
                    attributeName="cy"
                    dur="${duration}"
                    repeatCount="indefinite"
                    calcMode="linear"
                    values="${cy.join(';')}"
                  />
                  <animate
                    attributeName="opacity"
                    dur="${duration}"
                    repeatCount="indefinite"
                    calcMode="linear"
                    values="${opacity.join(';')}"
                  />
                </circle>
              `);
            }

            /* Eye follows the head. */
            parts.push(`
              <circle
                cx="${Number(headXValues.split(';')[0]) - 1.8}"
                cy="${Number(headYValues.split(';')[0]) - 1.8}"
                r="1.35"
                fill="#ffffff"
              >
                <animate
                  attributeName="cx"
                  dur="${duration}"
                  repeatCount="indefinite"
                  calcMode="linear"
                  values="${eyeXValues}"
                />
                <animate
                  attributeName="cy"
                  dur="${duration}"
                  repeatCount="indefinite"
                  calcMode="linear"
                  values="${eyeYValues}"
                />
              </circle>
            `);

            const scoreValues = frames
              .map(frame => frame.score)
              .join(';');

            const lengthValues = frames
              .map(frame => frame.length)
              .join(';');

            parts.push(`
              <text
                x="${width / 2}"
                y="${height - 11}"
                text-anchor="middle"
                font-family="Arial, Helvetica, sans-serif"
                font-size="10"
                fill="${text}"
              >
                🐍 Snake Game • Score <tspan>${frames[0].score}</tspan> • Length <tspan>${frames[0].length}</tspan>
              </text>
            `);

            /*
             * Keep visible metadata simple. The actual game state is in the
             * animated body and food elements above.
             */

            return `<?xml version="1.0" encoding="UTF-8"?>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="${width}"
            height="${height}"
            viewBox="0 0 ${width} ${height}"
            role="img"
            aria-label="Animated GitHub contribution Snake game"
          >
            ${parts.join('\n')}
          </svg>`;
          }

          async function main() {
            console.log(`Loading contribution data for ${USERNAME}...`);

            const data = await githubGraphQL();
            const calendar =
              data?.user?.contributionsCollection?.contributionCalendar;

            if (!calendar) {
              throw new Error('Contribution calendar tidak ditemukan.');
            }

            const now = new Date();
            const seed =
              calendar.totalContributions * 2654435761 +
              now.getUTCFullYear() * 10007 +
              (now.getUTCMonth() + 1) * 313;

            console.log(`Total contributions: ${calendar.totalContributions}`);
            console.log(`Weeks: ${calendar.weeks.length}`);
            console.log(`Simulation seed: ${seed}`);

            const simulation = simulate(calendar, seed >>> 0);

            console.log(`Generated frames: ${simulation.frames.length}`);
            console.log(
              `Max snake length: ${Math.max(...simulation.frames.map(frame => frame.length))}`
            );
            console.log(
              `Food eaten: ${Math.max(...simulation.frames.map(frame => frame.score))}`
            );

            fs.mkdirSync('/tmp/snake-game', { recursive: true });

            fs.writeFileSync(
              '/tmp/snake-game/github-contribution-grid-snake.svg',
              buildSvg(calendar, simulation, false),
              'utf8'
            );

            fs.writeFileSync(
              '/tmp/snake-game/github-contribution-grid-snake-dark.svg',
              buildSvg(calendar, simulation, true),
              'utf8'
            );

            console.log('Snake game SVG berhasil dibuat.');
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Publish SVG to output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          PUBLISH_DIR="$RUNNER_TEMP/snake-output"
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          rm -rf "$PUBLISH_DIR"
          mkdir -p "$PUBLISH_DIR"

          cd "$PUBLISH_DIR"
          git init
          git checkout --orphan output
          git remote add origin "$REMOTE"

          cp /tmp/snake-game/github-contribution-grid-snake.svg .
          cp /tmp/snake-game/github-contribution-grid-snake-dark.svg .
          touch .nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            github-contribution-grid-snake.svg \
            github-contribution-grid-snake-dark.svg \
            .nojekyll

          git commit -m "Update Snake game animation"
          git push origin output --force
